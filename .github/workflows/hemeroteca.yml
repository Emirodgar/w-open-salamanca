name: Actualizar hemeroteca

on:
  schedule:
    # Horas en UTC (GitHub Actions no admite huso horario ni ajusta el
    # horario de verano). Ejecuciones deseadas, hora de Madrid: 7:00,
    # 8:00, 9:00, y luego cada 2h (11, 13, 15, 17, 19, 21), más una
    # única ejecución nocturna a las 0:00 (tras la cual no vuelve a
    # correr hasta las 7:00 del día siguiente).
    # Con CEST (UTC+2, en vigor ahora mismo) eso equivale a las horas
    # UTC de abajo: 5,6,7,9,11,13,15,17,19,22.
    # Si se deja este cron sin tocar, cuando en invierno pase a CET
    # (UTC+1, desde el último domingo de octubre) esas mismas horas UTC
    # pasarán a corresponder a las 6:00, 7:00, 8:00, 10:00, 12:00,
    # 14:00, 16:00, 18:00, 20:00 y 23:00 en Madrid — una hora antes de
    # lo previsto. Para mantener los horarios locales originales
    # (7,8,9,11,13,15,17,19,21,0) habría que sumar 1 a cada hora UTC de
    # la lista: '15 6,7,8,10,12,14,16,18,20,23 * * *'.
    - cron: '15 5,6,7,9,11,13,15,17,19,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hemeroteca
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar hemeroteca.json
        run: node scripts/hemeroteca/build.mjs

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet -- hemeroteca.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hemeroteca.json
          git commit -m "Actualiza hemeroteca.json [skip ci]"
          git push
