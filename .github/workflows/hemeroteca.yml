name: Actualizar hemeroteca

on:
  schedule:
    # Horas en UTC (GitHub Actions no admite huso horario ni ajusta el
    # horario de verano). Con CEST (UTC+2, en vigor ahora mismo) esto
    # equivale a cada 2h de 07:00 a 21:00 y cada ~3-6h de madrugada
    # (22:00 y 04:00) hora de Madrid. En invierno (CET, UTC+1) el
    # tramo se desplaza una hora antes (06:00-20:00).
    - cron: '15 2,5,7,9,11,13,15,17,19,20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hemeroteca
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar hemeroteca.json
        run: node scripts/hemeroteca/build.mjs

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet -- hemeroteca.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hemeroteca.json
          git commit -m "Actualiza hemeroteca.json [skip ci]"
          git push
