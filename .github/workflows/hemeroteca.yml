name: Actualizar hemeroteca

on:
  schedule:
    # Horas en UTC (GitHub Actions no admite huso horario ni ajusta el
    # horario de verano). Ejecuciones deseadas, hora de Madrid:
    #   - de 6:00 a 22:00, cada 30 minutos.
    #   - de 22:00 a 6:00, cada hora.
    # Los minutos van en :15/:45 (nunca en punto) para no coincidir con
    # la hora de mayor carga en GitHub Actions, que es cuando más se
    # retrasan o se saltan las ejecuciones.
    #
    # Con CEST (UTC+2, en vigor ahora mismo) eso equivale a:
    #   - diurno (6:15/6:45...21:15/21:45 Madrid): '15,45 4-19 * * *'
    #   - nocturno (22:15, 23:15, 0:15...5:15 Madrid):
    #     '15 20,21,22,23,0,1,2,3 * * *'
    #
    # Si se deja este cron sin tocar, cuando en invierno pase a CET
    # (UTC+1, desde el último domingo de octubre) estas mismas horas UTC
    # pasarán a corresponder a una hora antes en Madrid. Para mantener
    # los horarios locales originales habría que sumar 1 a cada hora
    # UTC de las dos listas:
    #   - diurno: '15,45 5-20 * * *'
    #   - nocturno: '15 21,22,23,0,1,2,3,4 * * *'
    - cron: '15,45 4-19 * * *'
    - cron: '15 20,21,22,23,0,1,2,3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hemeroteca
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar hemeroteca.json
        run: node scripts/hemeroteca/build.mjs

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet -- hemeroteca.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hemeroteca.json
          git commit -m "Actualiza hemeroteca.json [skip ci]"
          git push
