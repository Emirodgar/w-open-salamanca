name: Actualizar hemeroteca

on:
  schedule:
    # GitHub Actions no admite huso horario ni ajusta el horario de
    # verano, así que disparamos a las dos horas UTC que pueden
    # corresponder a las 7:00 en Madrid (5:00 UTC en CEST, verano;
    # 6:00 UTC en CET, invierno). El paso "Comprobar hora de Madrid" de
    # abajo calcula la hora local real con TZ=Europe/Madrid y descarta la
    # ejecución que no sea exactamente las 7:00, así que solo una de las
    # dos dispara el resto del job cada día, todo el año, sin que haga
    # falta tocar este cron a mano en los cambios de hora.
    - cron: '0 5,6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hemeroteca
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar hora de Madrid
        id: hora
        run: |
          hora_madrid=$(TZ=Europe/Madrid date +%H)
          if [ "$hora_madrid" = "07" ]; then
            echo "Son las 07:00 en Madrid: se ejecuta la actualización."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Son las ${hora_madrid}:00 en Madrid (no las 07:00): esta ejecución programada no hace nada."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.hora.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Configurar Node
        if: steps.hora.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Claude Code
        if: steps.hora.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar identidad de git para el commit automático
        if: steps.hora.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar skill de hemeroteca vía Claude Code
        if: steps.hora.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Ejecuta la skill 'hemeroteca' (ver .claude/skills/hemeroteca/SKILL.md): corre node scripts/hemeroteca/build.mjs para regenerar hemeroteca.json y, si el fichero ha cambiado respecto al commit actual, haz git add, commit y push de ese cambio tú mismo sin pedir confirmación. Si no hay cambios, no hagas commit y dilo." \
            --dangerously-skip-permissions
