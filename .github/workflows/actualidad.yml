name: Actualizar actualidad (Gemini, a diario)

on:
  schedule:
    # GitHub Actions retrasa (y a veces directamente se salta) los
    # triggers de `schedule`: se ha comprobado que un cron a las 5:00/6:00 UTC
    # ha llegado a disparar con 4-5 h de retraso y que se pierden disparos.
    # Por eso hay varios disparadores entre las 7:00 y las 11:00 hora de
    # Madrid (5-9 UTC en verano, 6-10 UTC en invierno; minutos :17/:47 para evitar
    # la hora en punto, la más saturada) y el paso "Comprobar si toca
    # actualizar" decide: solo ejecuta si hoy (hora de Madrid) aún no se ha
    # actualizado y ya son las 7:00 en Madrid. El primer disparo que llegue
    # hace el trabajo; los siguientes de ese día se saltan. Como red de
    # seguridad extra, el Worker de cloudflare-worker/actualidad-trigger lanza
    # el workflow por workflow_dispatch si GitHub no ha disparado ninguno.
    - cron: '17 5,6,7,8,9,10 * * *'
    - cron: '47 5,7,9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualidad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar si toca actualizar (una vez al día, desde las 7:00 de Madrid)
        id: cuando
        run: |
          hoy=$(TZ=Europe/Madrid date +%F)
          hora=$(TZ=Europe/Madrid date +%H)
          ultimo=$(TZ=Europe/Madrid git log -1 --date=format-local:%F --format=%cd -- actualidad.json || echo "")
          if [ "$ultimo" = "$hoy" ]; then
            echo "actualidad.json ya se actualizó hoy ($hoy): no toca."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          elif [ "$((10#$hora))" -lt 7 ]; then
            echo "Son las ${hora}h en Madrid (antes de las 7:00): no toca todavía."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          else
            echo "Último commit: ${ultimo:-ninguno}; hoy es $hoy y son las ${hora}h en Madrid: toca ejecutar."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Python
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar actualidad, timeline, eventos y Opina con Gemini
        id: build
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        env:
          # Es un secret del repo; si se guardó como "variable" de Actions,
          # se recoge igualmente con vars.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: python3 scripts/actualidad/build.py

      - name: Commit y push de lo que haya cambiado
        id: commit
        if: steps.build.outcome == 'success'
        run: |
          # Solo los ficheros que el script declara haber tocado (nunca add -A).
          git add ${{ steps.build.outputs.ficheros }}
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualiza actualidad, timeline y Opina (${{ steps.build.outputs.periodo }})"
          git push
          echo "nuevo=true" >> "$GITHUB_OUTPUT"

      - name: Enviar el resumen por Telegram
        # Un fallo aquí (o la falta de secrets) no debe tumbar el workflow:
        # el commit ya está hecho.
        if: steps.commit.outputs.nuevo == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/actualidad/telegram.py
