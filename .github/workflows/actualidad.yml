name: Actualizar actualidad (skill vía Claude Code)

on:
  schedule:
    # GitHub Actions retrasa (y a veces directamente se salta) los
    # triggers de `schedule` para esta cuenta: comprobado en la práctica
    # que un cron puesto a las 5:00/6:00 UTC ha llegado a disparar hasta
    # las 10:20 UTC, con 4-5h de retraso, y solo 3 de los ~8 disparos
    # esperados en 4 días llegaron a producirse. Por eso NO intentamos
    # acertar una hora exacta: disparamos un chequeo barato cada 3 horas
    # todo el día, y el paso "Comprobar si toca actualizar" decide si
    # procede mirando cuánto tiempo ha pasado de verdad desde el último
    # commit de actualidad.json, no la hora del reloj. Así, la primera
    # vez que GitHub se digne a lanzar el cron tras cumplirse el plazo,
    # se ejecuta — sea a la hora que sea.
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualidad
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar si toca actualizar (por tiempo transcurrido, no por hora)
        id: cuando
        run: |
          ultimo=$(git log -1 --format=%ct -- actualidad.json || echo 0)
          ahora=$(date -u +%s)
          if [ -z "$ultimo" ]; then ultimo=0; fi
          horas=$(( (ahora - ultimo) / 3600 ))
          umbral=44
          if [ "$ultimo" = "0" ] || [ "$horas" -ge "$umbral" ]; then
            echo "Han pasado ${horas}h desde el último commit de actualidad.json (umbral ${umbral}h): toca ejecutar."
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Han pasado solo ${horas}h desde el último commit de actualidad.json (umbral ${umbral}h): no toca todavía."
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Node
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Claude Code
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install -g @anthropic-ai/claude-code

      - name: Configurar identidad de git para el commit automático
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ejecutar skill de actualidad vía Claude Code
        if: steps.cuando.outputs.ejecutar == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "Ejecuta la skill 'sitemap-mapa-calor-tematico' (ver .claude/skills/sitemap-mapa-calor-tematico/SKILL.md) con sus valores por defecto de este proyecto (La Gaceta de Salamanca, secciones excluidas nacional,opinion,tu-gaceta,gente-estilo,podcast): sigue los pasos 1 a 5 completos (análisis del sitemap, redacción del resumen, JSON mensual del timeline, eventos.json y preguntas de Opina), y termina con el paso 6, haciendo git add solo de los ficheros que hayas tocado, commit y push tú mismo sin pedir confirmación en el chat. Si en este entorno no tienes acceso a un navegador con JavaScript para revisar la programación de ciudaddecultura.org (paso 4.3), sáltate solo esa fuente concreta y dilo explícitamente en tu resumen final, sin fallar el resto del proceso por ello." \
            --dangerously-skip-permissions
