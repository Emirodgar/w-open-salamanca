name = "actualidad-trigger"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Disparadores en UTC. 05:45 UTC = 07:45 Madrid en verano; en invierno son las
# 06:45, así que el de 07:45 UTC (08:45 Madrid) y el de 09:45 UTC (10:45) son
# los que cubren la franja de las 7:00 a las 11:00. Los workflows a lanzar
# están en la constante JOBS de src/index.js.
[triggers]
crons = ["45 5,7,9 * * *"]
